<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" type="image/png" href="/favicon.png"><title>Sign in · vpin-dashboard</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e6edf7;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:100%;max-width:400px;background:#111c2e;border:1px solid #1f2f47;border-radius:12px;padding:28px}.mark{color:#f5b81d;font-size:34px;font-weight:800;margin:0}h1{font-size:26px;margin:18px 0 8px}.muted{color:#8fa3bd;font-size:14px;line-height:1.5}label{display:block;font-size:14px;margin:18px 0 6px}input{width:100%;padding:12px;background:#0b1220;border:1px solid #31496e;border-radius:6px;color:inherit;font:inherit}button{width:100%;min-height:46px;margin-top:24px;border:0;border-radius:6px;background:#f5b81d;color:#1a1405;font-size:15px;font-weight:700;cursor:pointer}button:disabled{opacity:.6}#message{color:#f5b81d;overflow-wrap:anywhere;font-size:14px;line-height:1.5}code{overflow-wrap:anywhere;font-size:12px}[hidden]{display:none!important}
</style><script src="/login.js" defer></script></head><body><main class="card"><img src="/brand-default.png" alt="" width="44" height="44"><p class="muted">VPIN DASHBOARD</p><h1 id="heading">Sign in</h1><p class="muted" id="intro">A private view of the pinball cabinet.</p><form id="login-form"><div id="setup" hidden><p class="muted">First admin setup requires the one-time token in <code>/data/auth/admin-setup-token</code> on your server. Open this page over HTTPS. Never share the token in chat.</p><label for="setup-token">Setup token</label><input id="setup-token" type="password" autocomplete="off"></div><label for="username">Username</label><input id="username" autocomplete="username" required minlength="3" maxlength="40" autocapitalize="none" spellcheck="false"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required maxlength="128"><p class="muted" id="password-note" hidden>Use at least 12 characters. There is no default password.</p><button id="submit" type="submit">Sign in</button><p id="message" role="status"></p></form></main></body></html>
