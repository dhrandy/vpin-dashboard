<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vpin-dashboard</title>
<style>
  :root{
    --bg:#0b1220; --surface:#111c2e; --surface2:#16233a; --text:#e6edf7;
    --dim:#8fa3bd; --border:#1f2f47; --accent:#f5b81d; --accent-ink:#1a1405;
    --cyan:#22d3ee; --green:#34d399; --red:#f87171;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}
  header{position:sticky;top:0;background:rgba(11,18,32,.96);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;z-index:5}
  nav{display:flex;gap:4px}
  nav button{background:transparent;border:0;color:var(--dim);font-weight:600;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:14px}
  nav button[aria-pressed="true"]{background:var(--surface2);color:var(--text)}
  .pill{margin-left:auto;display:inline-flex;gap:8px;align-items:center;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
  main{max-width:1200px;margin:0 auto;padding:16px 14px 40px}
  .banner{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:12px;display:none}
  .nowplaying{text-align:center;color:var(--cyan);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:6px;border-top:1px solid var(--border);display:none}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  input[type="search"],select{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 10px;font-size:14px}
  input[type="search"]{flex:1;min-width:180px;max-width:340px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:1000px){.grid{grid-template-columns:repeat(5,1fr)}}
  .card{border:1px solid var(--border);background:var(--surface);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
  .art{aspect-ratio:3/4;padding:12px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(160deg,var(--surface2),#0d1830 60%,#132341);cursor:pointer;border:0;text-align:left;color:var(--text);width:100%}
  .art h3{margin:0;font-size:22px;line-height:1.1;text-transform:uppercase;letter-spacing:.02em}
  .art .meta{color:var(--dim);font-size:12px;margin-top:4px}
  .badge{align-self:flex-start;background:rgba(0,0,0,.45);color:var(--cyan);border-radius:4px;padding:2px 6px;font-size:11px;font-weight:700}
  .cardfoot{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;gap:8px}
  .top{font-size:11px;text-transform:uppercase;color:var(--dim)}
  .score{color:var(--accent);font-size:20px;font-weight:700}
  .play{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:8px 14px;font-weight:700;cursor:pointer}
  .play:disabled{opacity:.4;cursor:default}
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(min-width:900px){.tiles{grid-template-columns:repeat(4,1fr)}}
  .tile{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:14px}
  .tile .v{color:var(--accent);font-size:30px;font-weight:700}
  .tile .l{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .panel{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:16px;margin-top:16px}
  .panel h3{margin:0 0 10px;text-transform:uppercase;letter-spacing:.03em}
  .row{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:14px}
  .bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:2px 0 8px}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
  dialog{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:14px;max-width:520px;width:92vw;padding:20px}
  dialog::backdrop{background:rgba(3,6,12,.75)}
  .muted{color:var(--dim);font-size:13px}
  .empty{text-align:center;padding:60px 20px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
</style>
</head>
<body>
<header>
  <nav aria-label="Pages">
    <button id="tab-library" aria-pressed="true">Library</button>
    <button id="tab-stats" aria-pressed="false">Stats</button>
  </nav>
  <span class="pill"><span class="dot" id="status-dot"></span><span id="status-label">Cabinet status unknown</span></span>
</header>
<div class="nowplaying" id="now-playing" role="status"></div>
<main>
  <div class="banner" id="banner" role="status"></div>
  <section id="view-library">
    <div class="toolbar">
      <input type="search" id="search" placeholder="Search tables, makers, years" aria-label="Search tables">
      <select id="sort" aria-label="Sort tables">
        <option value="name">Sort: Name</option>
        <option value="score">Sort: Highest score</option>
        <option value="year-desc">Sort: Year, newest</option>
        <option value="year-asc">Sort: Year, oldest</option>
      </select>
      <select id="filter" aria-label="Filter tables">
        <option value="all">All tables</option>
        <option value="with-scores">With scores</option>
        <option value="no-scores">No scores yet</option>
      </select>
    </div>
    <p class="muted" id="count"></p>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">
      <h2>No tables loaded</h2>
      <p class="muted" id="empty-text">The cabinet has not answered yet. Turn the cabinet on and reload this page.</p>
    </div>
  </section>
  <section id="view-stats" style="display:none">
    <div class="tiles" id="tiles"></div>
    <div class="panel"><h3>Top tables by best score</h3><div id="top-tables"></div></div>
    <div class="panel"><h3>Player leaderboard</h3><div id="players"></div></div>
    <div class="panel"><h3>Tables by maker</h3><div id="makers"></div></div>
  </section>
</main>
<dialog id="detail"></dialog>
<script>
const $ = (id) => document.getElementById(id);
let DATA = { tables: [], scores: [], playlists: [] };
let STATUS = { state: "unknown", gamePlaying: false, playingText: null };
const fmt = (n) => (n === null || n === undefined ? "—" : Number(n).toLocaleString("en-US"));

function bestByTable() {
  const map = new Map();
  for (const s of DATA.scores) {
    const cur = map.get(s.gameId);
    if (!cur) map.set(s.gameId, { best: s.score, initials: s.initials, count: 1, scores: [s] });
    else { cur.count++; cur.scores.push(s); if (s.score > cur.best) { cur.best = s.score; cur.initials = s.initials; } }
  }
  for (const v of map.values()) v.scores.sort((a, b) => a.rank - b.rank || b.score - a.score);
  return map;
}

function renderStatus() {
  const dot = $("status-dot"), label = $("status-label");
  dot.style.background = STATUS.state === "online" ? "var(--green)" : STATUS.state === "offline" ? "var(--red)" : "var(--dim)";
  label.textContent = STATUS.state === "online" ? "Cabinet online" : STATUS.state === "offline" ? "Cabinet offline" : "Cabinet status unknown";
  const np = $("now-playing");
  if (STATUS.gamePlaying) { np.style.display = "block"; np.textContent = "Now playing" + (STATUS.playingText ? ": " + STATUS.playingText : " on the cabinet"); }
  else np.style.display = "none";
}

function renderLibrary() {
  const best = bestByTable();
  const q = $("search").value.trim().toLowerCase();
  const filter = $("filter").value, sort = $("sort").value;
  let rows = DATA.tables.map((t) => ({ ...t, bestScore: best.get(t.gameId)?.best ?? null, bestInitials: best.get(t.gameId)?.initials ?? null, scoreCount: best.get(t.gameId)?.count ?? 0 }));
  if (filter === "with-scores") rows = rows.filter((t) => t.scoreCount > 0);
  if (filter === "no-scores") rows = rows.filter((t) => t.scoreCount === 0);
  if (q) rows = rows.filter((t) => t.name.toLowerCase().includes(q) || (t.maker || "").toLowerCase().includes(q) || String(t.year || "").includes(q));
  if (sort === "name") rows.sort((a, b) => a.name.localeCompare(b.name));
  if (sort === "score") rows.sort((a, b) => (b.bestScore ?? -1) - (a.bestScore ?? -1));
  if (sort === "year-desc") rows.sort((a, b) => (b.year ?? -1) - (a.year ?? -1));
  if (sort === "year-asc") rows.sort((a, b) => (a.year ?? 99999) - (b.year ?? 99999));
  $("count").textContent = rows.length + " of " + DATA.tables.length + " tables";
  $("empty").style.display = DATA.tables.length === 0 ? "block" : "none";
  const canPlay = STATUS.state === "online" && !STATUS.gamePlaying;
  $("grid").innerHTML = rows.map((t) => `
    <article class="card">
      <button class="art" data-open="${t.gameId}" aria-label="View details for ${escapeHtml(t.name)}">
        <span class="badge">${t.scoreCount > 0 ? t.scoreCount + " SCORE" + (t.scoreCount === 1 ? "" : "S") : "NO SCORES YET"}</span>
        <span><h3>${escapeHtml(t.name)}</h3><span class="meta">${escapeHtml([t.maker, t.year].filter(Boolean).join(" · ") || "Maker and year not reported")}</span></span>
      </button>
      <div class="cardfoot">
        <span><span class="top">Top${t.bestInitials ? " · " + escapeHtml(t.bestInitials) : ""}</span><br><span class="score">${fmt(t.bestScore)}</span></span>
        <button class="play" data-play="${t.gameId}" ${canPlay ? "" : "disabled"} aria-label="Play ${escapeHtml(t.name)} on the cabinet">▶ Play</button>
      </div>
    </article>`).join("");
  document.querySelectorAll("[data-open]").forEach((b) => b.addEventListener("click", () => openDetail(Number(b.dataset.open))));
  document.querySelectorAll("[data-play]").forEach((b) => b.addEventListener("click", () => play(Number(b.dataset.play))));
}

function renderStats() {
  const best = bestByTable();
  const withScores = [...best.keys()].length;
  const highest = Math.max(0, ...[...best.values()].map((v) => v.best));
  const makers = new Map();
  for (const t of DATA.tables) if (t.maker) makers.set(t.maker, (makers.get(t.maker) || 0) + 1);
  $("tiles").innerHTML = [
    ["Tables on cabinet", DATA.tables.length], ["Tables with scores", withScores],
    ["Highest score", fmt(highest || null)], ["Makers", makers.size],
  ].map(([l, v]) => `<div class="tile"><div class="l">${l}</div><div class="v">${v}</div></div>`).join("");
  const tops = DATA.tables.map((t) => ({ ...t, best: best.get(t.gameId)?.best ?? null, initials: best.get(t.gameId)?.initials ?? null }))
    .filter((t) => t.best !== null).sort((a, b) => b.best - a.best).slice(0, 10);
  const max = tops[0]?.best || 1;
  $("top-tables").innerHTML = tops.length ? tops.map((t, i) => `
    <div class="row"><span>${i + 1}. ${escapeHtml(t.name)}${t.initials ? " · " + escapeHtml(t.initials) : ""}</span><strong style="color:var(--accent)">${fmt(t.best)}</strong></div>
    <div class="bar"><i style="width:${Math.max(4, (t.best / max) * 100)}%"></i></div>`).join("") : '<p class="muted">No scores pulled from the cabinet yet.</p>';
  const players = new Map();
  for (const v of best.values()) {
    if (!v.initials) continue;
    const p = players.get(v.initials) || { n: 0, best: 0 };
    p.n++; p.best = Math.max(p.best, v.best); players.set(v.initials, p);
  }
  $("players").innerHTML = players.size ? [...players.entries()].sort((a, b) => b[1].n - a[1].n).slice(0, 10)
    .map(([ini, p], i) => `<div class="row"><span>${i + 1}. ${escapeHtml(ini)}</span><span class="muted">${p.n} table${p.n === 1 ? "" : "s"} topped · best ${fmt(p.best)}</span></div>`).join("")
    : '<p class="muted">No player initials in the cabinet scores yet.</p>';
  $("makers").innerHTML = makers.size ? [...makers.entries()].sort((a, b) => b[1] - a[1])
    .map(([m, c]) => `<div class="row"><span>${escapeHtml(m)}</span><span class="muted">${c}</span></div>`).join("")
    : '<p class="muted">The cabinet did not report maker names.</p>';
}

function escapeHtml(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

async function openDetail(gameId) {
  const t = DATA.tables.find((x) => x.gameId === gameId);
  if (!t) return;
  const best = bestByTable().get(gameId);
  const d = $("detail");
  d.innerHTML = `
    <h2 style="margin:0;text-transform:uppercase">${escapeHtml(t.name)}</h2>
    <p class="muted">${escapeHtml([t.maker, t.year].filter(Boolean).join(" · ") || "Maker and year not reported")}</p>
    <h3 style="text-transform:uppercase;font-size:13px;color:var(--dim)">Scores on this table</h3>
    ${best ? best.scores.map((s) => `<div class="row"><span>#${s.rank} ${escapeHtml(s.initials || "—")}</span><strong style="color:var(--accent)">${fmt(s.score)}</strong></div>`).join("") : '<p class="muted">No scores recorded on this table.</p>'}
    <div id="detail-extra" class="muted">Loading cabinet details…</div>
    <button class="play" id="detail-play" style="width:100%;margin-top:14px;padding:12px" ${STATUS.state === "online" && !STATUS.gamePlaying ? "" : "disabled"}>▶ Play on the cabinet</button>
    <p class="muted" style="text-align:center">Launches through VPin Studio on the cabinet.</p>
    <button id="detail-close" style="width:100%;margin-top:6px;padding:10px;background:var(--surface2);color:var(--text);border:0;border-radius:6px;cursor:pointer">Close</button>`;
  d.showModal();
  $("detail-close").addEventListener("click", () => d.close());
  $("detail-play").addEventListener("click", () => { d.close(); play(gameId); });
  try {
    const res = await fetch("/api/details/" + gameId).then((r) => r.json());
    const fields = res && res.details && typeof res.details === "object"
      ? Object.entries(res.details).filter(([, v]) => ["string", "number", "boolean"].includes(typeof v) && v !== "").slice(0, 20) : [];
    $("detail-extra").innerHTML = fields.length
      ? "<h3 style='text-transform:uppercase;font-size:13px;color:var(--dim)'>Cabinet details</h3>" + fields.map(([k, v]) => `<div class="row"><span class="muted">${escapeHtml(k)}</span><span>${escapeHtml(v)}</span></div>`).join("")
      : "The cabinet reported no extra detail fields for this table.";
  } catch { $("detail-extra").textContent = "Cabinet details could not be loaded."; }
}

async function play(gameId) {
  const t = DATA.tables.find((x) => x.gameId === gameId);
  showBanner("Asking VPin Studio to launch " + (t ? t.name : "the table") + " on the cabinet…");
  try {
    const res = await fetch("/api/play", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ gameId }) }).then((r) => r.json().then((j) => ({ status: r.status, body: j })));
    if (res.body && res.body.ok) showBanner((t ? t.name : "Table") + " is launching on the cabinet.");
    else if (res.status === 409) showBanner("A game is already running on the cabinet. Finish that game first.");
    else showBanner("The launch failed: " + ((res.body && res.body.error) || ("bridge HTTP " + res.status)));
  } catch (e) { showBanner("The launch failed: " + e.message); }
  loadStatus();
}

function showBanner(msg) { const b = $("banner"); b.textContent = msg; b.style.display = "block"; }

async function loadStatus() {
  try {
    const res = await fetch("/api/status").then((r) => r.json());
    const reachable = res && res.health && res.health.cabinet_reachable;
    const playing = (res && res.health && res.health.game_playing) || (res && res.status && Number(res.status.gameId) > 0);
    STATUS = {
      state: reachable === undefined ? "unknown" : reachable ? "online" : "offline",
      gamePlaying: !!playing,
      playingText: (res && res.status && res.status.text) || null,
    };
  } catch { STATUS = { state: "offline", gamePlaying: false, playingText: null }; }
  renderStatus(); renderLibrary();
}

async function load() {
  try {
    const res = await fetch("/api/library").then((r) => r.json());
    if (res && res.ok) DATA = res;
    else if (res && res.error) $("empty-text").textContent = "The bridge pull failed: " + res.error;
  } catch (e) { $("empty-text").textContent = "The library could not be loaded: " + e.message; }
  renderLibrary(); renderStats();
  await loadStatus();
}

$("tab-library").addEventListener("click", () => switchTab("library"));
$("tab-stats").addEventListener("click", () => switchTab("stats"));
function switchTab(which) {
  $("view-library").style.display = which === "library" ? "block" : "none";
  $("view-stats").style.display = which === "stats" ? "block" : "none";
  $("tab-library").setAttribute("aria-pressed", String(which === "library"));
  $("tab-stats").setAttribute("aria-pressed", String(which === "stats"));
}
["search", "sort", "filter"].forEach((id) => $(id).addEventListener("input", renderLibrary));
load();
setInterval(load, 30000);
</script>
</body>
</html>
